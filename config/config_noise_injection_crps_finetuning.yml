general:
  desc: "Two-member two-step ERA5 almost-fair CRPS fine-tuning from sdnbfpve"
  istep: 0

streams:
  ERA5:
    diagnostic: true
    forcing: false
    reconstruct: true
  AVHRR: {reconstruct: false}
  ERA5_in: {reconstruct: false}
  GOES_ABI_VIS: {reconstruct: false}
  GOES_ABI_IR: {reconstruct: false}
  HIMAWARI_AHI_VIS: {reconstruct: false}
  HIMAWARI_AHI_IR: {reconstruct: false}
  ICON_DREAM_TP: {reconstruct: false}
  METEOSAT_SEVIRI_IR: {reconstruct: false}
  METOP_ABC_IASI: {reconstruct: false}
  SurfaceCombined: {reconstruct: false}

crps_losses:
  physical:
    type: LossPhysical
    loss_fcts:
      kernel_crps:
        weight: 1.0
        alpha: 0.95

training_config:
  training_mode: ["masking"]
  num_mini_epochs: 8
  losses: ${crps_losses}
  learning_rate_scheduling:
    parallel_scaling_policy: "sqrt"
  noise:
    enabled: true
    noise_dim: 16
    hidden_dim: 64
    noise_std: 1.0
    condition_on_forecast_step: true
  forecast:
    num_steps: 2
    num_members: 2
    policy: "fixed"
    pushforward: false

validation_config:
  losses: ${crps_losses}
  forecast:
    num_steps: 2
    policy: "fixed"
    pushforward: false
  validate_before_training: true

test_config:
  losses: ${crps_losses}
  forecast:
    num_steps: 2
    policy: "fixed"
    pushforward: false