general:
  desc: "Two-member almost-fair CRPS fine-tuning from sdnbfpve"
  istep: 0

load_chkpt:
  run_id: sdnbfpve
  mini_epoch: -1

streams:
  ERA5:
    diagnostic: true
    forcing: false
    reconstruct: true

freeze_modules: ""
reset_modules: ""
fe_impute_latent_noise_std: 0.0

diffusion:
  enabled: false
  latent_dim: null
  conditioning_type: null

noise_injector:
  enabled: true
  ensemble_size: 2
  member_parallel: true
  noise_dim: 16
  hidden_dim: 64
  noise_std: 1.0

crps_losses:
  physical:
    type: LossPhysical
    loss_fcts:
      kernel_crps:
        weight: 1.0
        alpha: 0.95

training_config:
  training_mode: ["masking"]
  num_mini_epochs: 8
  losses: ${crps_losses}
  learning_rate_scheduling:
    lr_start: 1e-6
    lr_max: 1e-5
    lr_final_decay: 1e-6
    lr_final: 0.0
    num_steps_warmup: 256
    num_steps_cooldown: 512
    policy_warmup: "cosine"
    policy_decay: "cosine"
    policy_cooldown: "linear"
    parallel_scaling_policy: "sqrt"
  forecast:
    offset: 1
    num_steps: 1
    policy: "fixed"
    pushforward: false

validation_config:
  losses: ${crps_losses}
  forecast:
    offset: 1
    num_steps: 1
    policy: "fixed"
    pushforward: false
  validate_before_training: true

test_config:
  losses: ${crps_losses}
  forecast:
    offset: 1
    num_steps: 1
    policy: "fixed"
    pushforward: false