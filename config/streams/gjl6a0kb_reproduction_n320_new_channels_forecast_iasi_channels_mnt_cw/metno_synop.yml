MET_Norway_aws :
  type : station
  filenames : ['metno_observations_v5.nc']
  stream_id : 300
#  source : []
  source : ['2t', 'tp', '2r', 'sp', '10si']
  target : ['2t', 'tp', '2r', 'sp', '10si']
  geoinfos : ["SFX.AVG_ZS", "SFX.FRAC_NATURE", "SFX.FRAC_SEA", "SFX.FRAC_TOWN", "SFX.FRAC_WATER", "SFX.MAX_ZS", "SFX.MIN_ZS", "SFX.ZS", "latitude", "longitude" ]
  diagnostic: True
  loss_weight : 1.0
#  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 64
  tokenize_spacetime : True
  max_num_targets: -1
  # used by data_reader_synop.py 
  latitude_name: 'latitude'
  longitude_name: 'longitude'
  embed :
    net : transformer
    num_tokens : 1
    num_heads : 2
    dim_embed : 256
    num_blocks : 2
  embed_target_coords :
    net : mlp
    dim_embed : 256
  target_readout :
    type : 'obs_value'  # token or obs_value
    num_layers : 3
    num_heads : 8
    dim_head_proj: 32
  pred_head :
    ens_size : 1
    num_layers : 2
