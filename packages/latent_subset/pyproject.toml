[project]
name = "weathergen-latent-subset"
version = "0.1.0"
description = "Subset raw WeatherGenerator hindcast archives geographically"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy-healpix~=1.1.2",
    "dask[array]>=2024.9.1",
    "numpy~=2.2",
    "xarray>=2026.9.0",
    "zarr~=3.1.3",
]

[project.scripts]
weathergen-subset = "weathergen_subset.subset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weathergen_subset"]

[tool.uv.workspace]
